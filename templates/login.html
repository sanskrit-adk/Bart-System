{% extends "base.html" %}
{% block title %}Sign In — BART{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top: 8vh">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <i class="bi bi-train-front-fill" style="font-size:3.5rem;color:var(--red)"></i>
      <h2 class="fw-bold mt-2 mb-0">BART System</h2>
      <p class="text-muted mt-1">Bay Area Rapid Transit</p>
    </div>
    <div class="card p-4">
      {% if error %}
      <div class="alert alert-danger py-2 mb-3" role="alert">{{ error }}</div>
      {% endif %}
      <form method="POST" autocomplete="on">
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:var(--muted)">USERNAME</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold" style="color:var(--muted)">PASSWORD</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary-bart w-100 py-2">Sign In</button>
      </form>
      <hr style="border-color:var(--border);margin:1.25rem 0">
      <p class="text-center text-muted small mb-0">
        New passenger? <a href="/register" style="color:var(--blue)">Create account</a>
      </p>
    </div>
    <p class="text-center mt-3" style="color:var(--muted);font-size:.8rem">
      Demo — Passenger: <strong style="color:var(--text)">alice / password123</strong>
      &nbsp;·&nbsp; Admin: <strong style="color:var(--text)">admin / admin123</strong>
    </p>
  </div>
</div>
{% endblock %}
