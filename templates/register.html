{% extends "base.html" %}
{% block title %}Create Account — BART{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top: 6vh">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <div class="text-center mb-4">
      <i class="bi bi-train-front-fill" style="font-size:3rem;color:var(--red)"></i>
      <h2 class="fw-bold mt-2 mb-0">Create Account</h2>
      <p class="text-muted mt-1">Join BART System</p>
    </div>
    <div class="card p-4">
      {% if error %}
      <div class="alert alert-danger py-2 mb-3" role="alert">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-semibold" style="color:var(--muted)">FULL NAME</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label small fw-semibold" style="color:var(--muted)">USERNAME</label>
            <input type="text" name="username" class="form-control" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:var(--muted)">EMAIL</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" style="color:var(--muted)">PASSWORD</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold" style="color:var(--muted)">PASSENGER TYPE</label>
          <select name="passenger_type" class="form-select">
            <option value="regular">Regular</option>
            <option value="student">Student — 25% discount</option>
            <option value="senior">Senior — 37.5% discount</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary-bart w-100 py-2">Create Account</button>
      </form>
      <hr style="border-color:var(--border);margin:1.25rem 0">
      <p class="text-center text-muted small mb-0">
        Already have an account? <a href="/login" style="color:var(--blue)">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
