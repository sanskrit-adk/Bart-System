<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BART System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d1a;
      --surface: #1a1a2e;
      --card: #16213e;
      --blue: #0a84ff;
      --red: #ff3b30;
      --green: #30d158;
      --yellow: #ffd60a;
      --text: #e0e0e0;
      --muted: #8e8ea0;
      --border: #2d2d4e;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    .navbar { background: var(--surface) !important; border-bottom: 1px solid var(--border); }
    .navbar-brand { font-weight: 700; font-size: 1.3rem; }
    .navbar-brand .logo-b { color: var(--red); }
    .navbar-brand .logo-art { color: var(--blue); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    .card-header { background: var(--surface); border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0 !important; padding: .85rem 1.25rem; font-weight: 600; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .stat-value { font-size: 1.9rem; font-weight: 700; color: var(--blue); }
    .stat-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: .2rem; }
    .balance-display { font-size: 2.5rem; font-weight: 700; color: var(--green); }
    .btn-primary-bart { background: var(--blue); color: #fff; border: none; border-radius: 8px; }
    .btn-primary-bart:hover { background: #0070d0; color: #fff; }
    .btn-danger-bart { background: var(--red); color: #fff; border: none; border-radius: 8px; }
    .btn-danger-bart:hover { background: #cc2a22; color: #fff; }
    .nav-tabs { border-bottom: 1px solid var(--border); }
    .nav-tabs .nav-link { color: var(--muted); border: none; padding: .6rem 1rem; }
    .nav-tabs .nav-link.active { color: var(--blue); background: transparent; border-bottom: 2px solid var(--blue); }
    .nav-tabs .nav-link:hover { color: var(--text); border-color: transparent; }
    .table { color: var(--text); }
    .table > :not(caption) > * > * { background: transparent !important; color: var(--text); border-bottom-color: var(--border); }
    .form-control, .form-select {
      background: var(--surface); border-color: var(--border); color: var(--text);
    }
    .form-control:focus, .form-select:focus {
      background: var(--surface); border-color: var(--blue); color: var(--text);
      box-shadow: 0 0 0 .2rem rgba(10,132,255,.2);
    }
    .form-control::placeholder { color: var(--muted); }
    select option { background: var(--surface); }
    .input-group-text { background: var(--surface); border-color: var(--border); color: var(--muted); }
    .alert-service-off { background: rgba(255,59,48,.12); border: 1px solid var(--red); color: var(--text); }
    .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 9999; }
    code { color: var(--blue); }
    .opacity-50 { opacity: .5; }
    .border-bottom-subtle { border-bottom: 1px solid var(--border) !important; }
  </style>
</head>
<body>

{% if session.get('username') %}
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/">
      <i class="bi bi-train-front-fill logo-b me-1"></i>
      <span class="logo-art">BART</span> System
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-muted small"><i class="bi bi-person-circle me-1"></i>{{ session.get('username') }}</span>
      <a href="/logout" class="btn btn-sm btn-outline-secondary">Sign out</a>
    </div>
  </div>
</nav>
{% endif %}

<div class="toast-container" id="toastContainer"></div>

<div class="container-fluid px-4 pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function showToast(msg, type = 'success') {
  const c = document.getElementById('toastContainer');
  const d = document.createElement('div');
  const colors = {success: '#30d158', danger: '#ff3b30', warning: '#ffd60a', info: '#0a84ff'};
  d.style.cssText = `background:${colors[type]||colors.success};color:${type==='warning'?'#000':'#fff'};padding:.75rem 1.25rem;border-radius:10px;margin-bottom:.5rem;font-size:.9rem;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:320px;`;
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 4000);
}

async function apiPost(url, data) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  });
  return r.json();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
